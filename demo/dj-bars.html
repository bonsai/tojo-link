<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>東上リンク｜DJバー候補</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#151515;background:#f5f5f2}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}
header{background:#111;color:#fff;border-radius:20px;padding:24px;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}.sub{opacity:.75}
.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:16px}input,select{padding:12px;border:1px solid #ccc;border-radius:12px;background:#fff;font-size:15px}
#count{margin:8px 2px 14px;color:#666;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:17px;box-shadow:0 3px 12px #0000000b}.card h2{font-size:19px;margin:0 0 5px}.meta{font-size:13px;color:#666;margin-bottom:10px}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#eee;margin:2px 4px 8px 0}.strong{background:#d9f7df}.medium{background:#fff0bd}.weak{background:#eee}.unknown{background:#ffdada}
p{line-height:1.55;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}a{border:0;border-radius:10px;padding:9px 11px;text-decoration:none;background:#111;color:#fff;font-size:13px}.secondary{background:#e9e9e9;color:#111}.empty{padding:30px;text-align:center;color:#777;display:none}
footer{margin-top:24px;color:#777;font-size:12px}@media(max-width:700px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header><h1>🚃 東上リンク｜DJバー候補</h1><div class="sub">Instagramを入口に、DJ可否をエビデンス確認していく調査台帳</div></header>
<div class="controls"><input id="q" placeholder="店名・駅・メモを検索"><select id="area"><option value="">エリアすべて</option></select><select id="evidence"><option value="">DJエビデンスすべて</option><option value="最強">最強</option><option value="強">強</option><option value="中">中</option><option value="弱">弱</option><option value="弱〜中">弱〜中</option><option value="不明">不明</option></select></div>
<div id="count"></div><div id="grid" class="grid"></div><div id="empty" class="empty">条件に一致する候補がありません。</div>
<footer>データ: research/tobu-tojo-dj-bars.json / 2026-08-16</footer></div>
<script>
const q=document.querySelector('#q'),area=document.querySelector('#area'),evidence=document.querySelector('#evidence'),grid=document.querySelector('#grid'),empty=document.querySelector('#empty'),count=document.querySelector('#count');let items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cls=s=>s==='最強'||s==='強'?'strong':s==='中'?'medium':s==='弱'?'weak':'unknown';
function card(x){let links='';if(x.instagram)links+=`<a href="${esc(x.instagram)}" target="_blank" rel="noopener">Instagram</a>`;if(x.instagram_search)links+=`<a class="secondary" href="${esc(x.instagram_search)}" target="_blank" rel="noopener">Instagram検索</a>`;links+=x.source_urls.map((u,i)=>`<a class="secondary" href="${esc(u)}" target="_blank" rel="noopener">根拠${i+1}</a>`).join('');return `<article class="card"><h2>${esc(x.name)}</h2><div class="meta">${esc(x.area)} / ${esc(x.station)} / ${esc(x.category)}</div><span class="badge ${cls(x.dj_evidence)}">DJエビデンス: ${esc(x.dj_evidence)}</span><span class="badge">${esc(x.dj_status)}</span><p>${esc(x.notes)}</p><p><b>次にやる:</b> ${esc(x.next_action)}</p><div class="actions">${links}</div></article>`}
function render(){const term=q.value.trim().toLowerCase(),a=area.value,e=evidence.value;const filtered=items.filter(x=>{const hay=[x.name,x.area,x.station,x.category,x.dj_status,x.notes,x.next_action].join(' ').toLowerCase();return(!term||hay.includes(term))&&(!a||x.area===a)&&(!e||x.dj_evidence===e)});count.textContent=`${filtered.length}件 / 全${items.length}件`;grid.innerHTML=filtered.map(card).join('');empty.style.display=filtered.length?'none':'block'}
async function init(){const res=await fetch('../research/tobu-tojo-dj-bars.json');const data=await res.json();items=data.items;[...new Set(items.map(x=>x.area))].sort().forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;area.appendChild(o)});render()}
[q,area,evidence].forEach(el=>el.addEventListener('input',render));init().catch(err=>{count.textContent='データ読み込みエラー';console.error(err)});
</script></body></html>
