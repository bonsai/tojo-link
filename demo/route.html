<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚃 東武東上線 路線図 — 池袋→鶴瀬</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f5f5f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .frame {
    width: 375px;
    height: 750px;
    background: #000;
    border-radius: 36px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .screen {
    width: 100%;
    height: 100%;
    background: #f5f5f0;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 24px;
    background: #000;
    border-radius: 0 0 14px 14px;
    z-index: 10;
  }

  .title {
    position: absolute;
    top: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #5b6abf;
  }
  .subtitle {
    position: absolute;
    top: 80px; left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    color: #999;
    transition: all 0.3s;
  }

  /* Map area */
  .map {
    position: absolute;
    top: 110px;
    left: 30px;
    right: 30px;
    bottom: 80px;
    background: #ebebe6;
    border-radius: 16px;
    overflow-y: auto;
    padding: 16px 0;
  }
  .map::-webkit-scrollbar { width: 0; }

  /* Line */
  .line {
    position: relative;
    width: 6px;
    height: 100%;
    background: #ccc;
    margin: 0 auto;
    border-radius: 3px;
  }
  .line-active {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    background: #ff6b35;
    border-radius: 3px;
    height: 0;
    transition: height 0.1s linear;
  }

  /* Stations */
  .station {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 2;
    transition: all 0.3s;
  }
  .dot {
    width: 20px; height: 20px;
    background: #ccc;
    border-radius: 50%;
    margin: 0 auto;
    transition: all 0.3s;
  }
  .dot.active {
    background: #ff6b35;
    width: 26px; height: 26px;
  }
  .dot.current {
    background: #ff6b35;
    width: 30px; height: 30px;
    animation: pulse 1s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(255,107,53,0); }
  }
  .label {
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
    transition: color 0.3s;
  }
  .label.active { color: #555; }
  .label.current { color: #ff6b35; font-weight: 700; font-size: 12px; }

  /* Train icon */
  .train {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    z-index: 3;
    transition: top 0.1s linear;
  }

  /* Destination badge */
  .dest {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #ff6b35;
    color: #fff;
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.5s ease;
  }
  .dest.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Progress bar */
  .progress {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: #ff6b35;
    transition: width 0.1s linear;
  }

  /* Replay button */
  .replay {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #5b6abf;
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div class="frame">
  <div class="screen">
    <div class="notch"></div>

    <div class="title">🚃 東武東上線</div>
    <div class="subtitle" id="subtitle">池袋駅から...</div>

    <div class="map" id="map">
      <div class="line" id="line">
        <div class="line-active" id="line-active"></div>
      </div>
      <div class="train" id="train">🚃</div>
      <div id="stations"></div>
    </div>

    <div class="dest" id="dest">🏠 鶴瀬駅</div>
    <div class="progress" id="progress"></div>
    <button class="replay" id="replay" onclick="start()">▶ もう一回</button>
  </div>
</div>

<script>
  const STATIONS = [
    { name: "池袋", num: 1 },
    { name: "中板橋", num: 2 },
    { name: "ときわ台", num: 3 },
    { name: "上板橋", num: 4 },
    { name: "東武練馬", num: 5 },
    { name: "下赤塚", num: 6 },
    { name: "成増", num: 7 },
    { name: "和光市", num: 8 },
    { name: "朝霞", num: 9 },
    { name: "志木", num: 10 },
    { name: "柳瀬川", num: 11 },
    { name: "みずほ台", num: 12 },
    { name: "鶴瀬", num: 13 },
  ];

  const mapEl = document.getElementById('map');
  const lineEl = document.getElementById('line');
  const lineActive = document.getElementById('line-active');
  const trainEl = document.getElementById('train');
  const stationsEl = document.getElementById('stations');
  const subtitle = document.getElementById('subtitle');
  const dest = document.getElementById('dest');
  const progress = document.getElementById('progress');
  const replay = document.getElementById('replay');

  const spacing = 52; // px between stations
  const mapHeight = STATIONS.length * spacing + 60;
  mapEl.style.height = mapHeight + 'px';
  lineEl.style.height = mapHeight + 'px';

  // Place stations
  STATIONS.forEach((s, i) => {
    const top = i * spacing;
    const div = document.createElement('div');
    div.className = 'station';
    div.style.top = top + 'px';
    div.id = `st-${s.name}`;
    div.innerHTML = `
      <div class="dot" id="dot-${s.name}"></div>
      <div class="label" id="lbl-${s.name}">${s.name}</div>
    `;
    stationsEl.appendChild(div);
  });

  function setStation(index) {
    // Update line
    const top = index * spacing;
    lineActive.style.height = top + 'px';

    // Update train position
    trainEl.style.top = (top - 8) + 'px';

    // Update dots and labels
    STATIONS.forEach((s, i) => {
      const dot = document.getElementById(`dot-${s.name}`);
      const lbl = document.getElementById(`lbl-${s.name}`);
      dot.className = 'dot';
      lbl.className = 'label';

      if (i < index) {
        dot.classList.add('active');
        lbl.classList.add('active');
      } else if (i === index) {
        dot.classList.add('current');
        lbl.classList.add('current');
      }
    });

    // Subtitle
    if (index < STATIONS.length - 1) {
      subtitle.textContent = `${STATIONS[index].name}通過...`;
      subtitle.style.color = '#999';
    } else {
      subtitle.textContent = '鶴瀬駅に到着！';
      subtitle.style.color = '#ff6b35';
      subtitle.style.fontWeight = '700';
    }
  }

  async function start() {
    // Reset
    lineActive.style.height = '0';
    trainEl.style.top = '-8px';
    dest.classList.remove('show');
    replay.classList.remove('show');
    progress.style.width = '0%';
    STATIONS.forEach(s => {
      document.getElementById(`dot-${s.name}`).className = 'dot';
      document.getElementById(`lbl-${s.name}`).className = 'label';
    });
    subtitle.textContent = '池袋駅から...';
    subtitle.style.color = '#999';
    subtitle.style.fontWeight = '400';

    // Animate
    for (let i = 0; i < STATIONS.length; i++) {
      setStation(i);
      progress.style.width = ((i + 1) / STATIONS.length * 100) + '%';
      await sleep(350);
    }

    // Arrived
    dest.classList.add('show');
    replay.classList.add('show');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Auto-start
  start();
</script>
</body>
</html>
