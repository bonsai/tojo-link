<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>狛犬QR｜Pixel Komainu QR</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#171411;color:#f4ead8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}
header{padding:20px;border:1px solid #45382d;border-radius:18px;background:#211b17}h1{margin:0 0 6px}.sub{color:#b9aa98}
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,.75fr);gap:14px;margin-top:14px}.panel{background:#211b17;border:1px solid #45382d;border-radius:18px;padding:16px}
.stage{display:grid;place-items:center;min-height:560px;background:#eee1c7;border-radius:14px;overflow:hidden}canvas{width:min(96%,560px);height:auto;image-rendering:pixelated}
label{display:block;font-size:12px;color:#b9aa98;margin:12px 0 6px}input{width:100%;padding:11px;border-radius:10px;border:1px solid #514237;background:#100d0b;color:#fff;font:14px ui-monospace,monospace}button{margin-top:10px;border:0;border-radius:10px;padding:10px 13px;background:#eee1c7;color:#211b17;cursor:pointer;font-weight:700}.hint{font-size:12px;color:#9f9182;line-height:1.6;margin-top:14px}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#382e27;color:#cdbca8;font-size:11px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{min-height:420px}}
</style>
</head>
<body><div class="wrap">
<header><h1>⛩️ 狛犬QR</h1><div class="sub">QRコードそのものは壊さず、ドット絵の狛犬として見せるHTML版</div></header>
<div class="grid">
<section class="panel"><div class="stage"><canvas id="c" width="640" height="640"></canvas></div></section>
<section class="panel">
<label for="text">QRに入れるURL / テキスト</label>
<input id="text" value="https://github.com/bonsai/tojo-link">
<button id="make">狛犬にする</button>
<div class="badge">誤り訂正 H / ドット絵表示</div>
<div class="hint">中央のQRは通常のQRモジュールをそのまま描画。周囲の頭・耳・前脚・尾をドットで追加して、全体を狛犬の姿にします。QRは誤り訂正Hを使います。<br><br>つまり「QRとして読める」ことを優先しつつ、「見た目は狛犬」にする方式です。</div>
</section></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),input=document.querySelector('#text');
const bg='#eee1c7',ink='#34251b',fur='#5b3a24',light='#8a613e';
function px(x,y,s,col){ctx.fillStyle=col;ctx.fillRect(x*s,y*s,s,s)}
function draw(){
  const qr=qrcode(0,'H'); qr.addData(input.value); qr.make();
  const n=qr.getModuleCount(); const cell=Math.floor(460/n); const ox=Math.floor((640-n*cell)/2); const oy=120;
  ctx.fillStyle=bg;ctx.fillRect(0,0,640,640);
  // pixel-art 狛犬: ears / head / mane
  const P=(x,y,c=fur)=>{ctx.fillStyle=c;ctx.fillRect(x*cell/4+ox-70,y*cell/4+oy-55,cell/4,cell/4)};
  // 大きなシルエットはQRの外側に置く
  const s=Math.max(4,Math.floor(cell/2));
  function block(x,y,w=1,h=1,c=fur){ctx.fillStyle=c;ctx.fillRect(320+x*s-w*s/2,115+y*s,s*w,s*h)}
  // 狛犬の耳・頭・たてがみ（QR領域の外）
  for(let i=-5;i<=5;i++)block(i,-2,1,1,fur);
  for(let i=-6;i<=6;i++)block(i,-1,1,1,fur);
  block(-7,-4,3,2,fur);block(7,-4,3,2,fur);block(-8,-5,2,2,light);block(8,-5,2,2,light);
  // QR本体（quiet zone相当の余白を確保）
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    ctx.fillStyle=qr.isDark(r,c)?ink:bg;ctx.fillRect(ox+c*cell,oy+r*cell,cell,cell);
  }
  // QRの下に狛犬の胸・前脚・後脚・尾を追加。QR本体には重ねない。
  const baseY=oy+n*cell+8;
  ctx.fillStyle=fur;
  ctx.fillRect(190,baseY,260,34);
  ctx.fillRect(205,baseY+34,55,78);ctx.fillRect(380,baseY+34,55,78);
  ctx.fillRect(155,baseY+15,35,22);ctx.fillRect(450,baseY+15,35,22);
  ctx.fillStyle=light;ctx.fillRect(218,baseY+45,28,28);ctx.fillRect(394,baseY+45,28,28);
  // しっぽ
  ctx.strokeStyle=fur;ctx.lineWidth=14;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(455,baseY+18);ctx.lineTo(505,baseY-20);ctx.lineTo(535,baseY+5);ctx.stroke();
  // 口・目をQRのfinder patternに寄せた装飾として外側に配置
  ctx.fillStyle=bg;ctx.fillRect(275,76,28,18);ctx.fillRect(337,76,28,18);
  ctx.fillStyle=ink;ctx.fillRect(284,82,10,8);ctx.fillRect(346,82,10,8);
  ctx.font='bold 18px sans-serif';ctx.fillStyle=ink;ctx.textAlign='center';ctx.fillText('阿吽',320,44);
}
document.querySelector('#make').onclick=draw;input.addEventListener('keydown',e=>{if(e.key==='Enter')draw()});draw();
</script>
</body></html>
