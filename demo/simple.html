<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚃 東上リンク</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .frame {
    width: 375px;
    height: 750px;
    background: #000;
    border-radius: 36px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .screen {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 24px;
    background: #000;
    border-radius: 0 0 14px 14px;
    z-index: 100;
  }

  /* ── Header ── */
  .header {
    background: #fff;
    padding: 32px 0 16px;
    text-align: center;
    border-bottom: 2px solid #eee;
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff6b35, #5b6abf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s ease;
  }
  .logo.show { opacity: 1; transform: translateY(0); }

  /* ── Main ── */
  .main {
    padding: 16px;
    overflow-y: auto;
    height: calc(100% - 90px);
  }

  /* ── Section Title ── */
  .section-title {
    font-size: 20px;
    font-weight: 700;
    color: #8d6e00;
    margin-bottom: 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.5s ease;
  }
  .section-title.show { opacity: 1; transform: translateY(0); }

  /* ── Recommend Card (big, simple) ── */
  .rec {
    background: #fff8e1;
    border: 2px solid #ffcc80;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
  }
  .rec.show { opacity: 1; transform: translateY(0); }
  .rec-icon { font-size: 32px; margin-bottom: 6px; }
  .rec-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .rec-sub { font-size: 16px; color: #999; }

  /* ── Link Card (big, simple) ── */
  .card {
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
  }
  .card.show { opacity: 1; transform: translateY(0); }
  .card.highlight { border-color: #ff6b35; background: #fff5f0; }
  .card.dim { opacity: 0.25 !important; transform: scale(0.95) !important; }

  .card-station {
    font-size: 20px;
    font-weight: 700;
    color: #ff6b35;
    margin-bottom: 8px;
  }
  .card-time { font-size: 14px; color: #bbb; float: right; margin-top: 4px; }
  .card-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }

  .card-link {
    display: block;
    background: #f0f4ff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 16px;
    color: #5b6abf;
    font-weight: 500;
    text-decoration: underline;
  }

  .card-tag {
    display: inline-block;
    font-size: 16px;
    background: #e8ecff;
    color: #5b6abf;
    padding: 6px 14px;
    border-radius: 20px;
    margin-right: 6px;
    font-weight: 600;
  }

  /* ── Big Save Button ── */
  .save-btn {
    display: block;
    width: 100%;
    padding: 18px;
    background: #ff6b35;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.3s;
  }
  .save-btn:active { transform: scale(0.95); }
  .save-btn.saved { background: #ccc; }
  .save-btn.pulse { animation: pulse 0.6s ease; }
  @keyframes pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* ── Chip (big) ── */
  .chips {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .chips.show { opacity: 1; }
  .chip {
    padding: 10px 20px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 30px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip.active { background: #5b6abf; color: #fff; border-color: #5b6abf; }
  .chip.hl { background: #ff6b35; color: #fff; border-color: #ff6b35; }

  /* ── Station Picker (big) ── */
  .picker {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    transform: translateY(100%);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 50;
  }
  .picker.open { transform: translateY(0); }
  .picker-handle {
    width: 50px; height: 6px;
    background: #ddd; border-radius: 3px;
    margin: 12px auto;
  }
  .picker-title {
    font-size: 22px; font-weight: 700;
    text-align: center; margin-bottom: 12px;
  }
  .picker-item {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 600;
    transition: background 0.2s;
  }
  .picker-item:active { background: #f0f4ff; }
  .picker-item.rec-star { background: #f0f4ff; }
  .picker-badge {
    display: inline-block;
    padding: 4px 10px;
    background: #ff6b35;
    color: #fff;
    font-size: 14px;
    border-radius: 10px;
    margin-left: auto;
  }

  @keyframes jelly {
    0% { transform: scale(1); }
    20% { transform: scale(0.95, 1.05); }
    40% { transform: scale(1.03, 0.97); }
    60% { transform: scale(0.98, 1.02); }
    80% { transform: scale(1.01, 0.99); }
    100% { transform: scale(1); }
  }
  .picker-item.jelly { animation: jelly 0.5s ease; }

  /* ── Post Form (big) ── */
  .form-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
    z-index: 60;
  }
  .form-overlay.open { opacity: 1; }
  .form-box {
    width: 100%;
    background: #fff;
    border-radius: 24px 24px 0 0;
    padding: 20px 24px 30px;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .form-overlay.open .form-box { transform: translateY(0); }
  .form-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 16px; }
  .form-label { font-size: 18px; font-weight: 600; color: #666; margin-bottom: 6px; }
  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 20px;
    background: #f8f9fa;
    margin-bottom: 12px;
  }
  .form-input.active { border-color: #5b6abf; background: #fff; }
  .form-btn {
    width: 100%;
    padding: 18px;
    background: #5b6abf;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .form-btn.show { opacity: 1; }

  /* ── Subtitle ── */
  .sub {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 80;
    text-align: center;
  }
  .sub.show { opacity: 1; }

  /* ── Toast ── */
  .toast {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 14px 28px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 90;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Progress ── */
  .progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 4px;
    background: linear-gradient(90deg, #ff6b35, #5b6abf);
    border-radius: 0 2px 0 0;
    transition: width 0.1s linear;
    z-index: 95;
  }

  /* ── End overlay ── */
  .end-bg {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.8s;
    z-index: 70;
    pointer-events: none;
  }
  .end-bg.show { opacity: 1; }
  .end-emoji { font-size: 80px; }
  .end-title {
    font-size: 44px; font-weight: 800;
    background: linear-gradient(135deg, #ff6b35, #5b6abf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 12px;
  }
  .end-sub { font-size: 24px; color: #999; margin-top: 8px; }
</style>
</head>
<body>

<div class="frame">
  <div class="screen">
    <div class="notch"></div>

    <div class="header">
      <div class="logo" id="logo">🚃 東上リンク</div>
    </div>

    <div class="main" id="main">
      <!-- Section Title -->
      <div class="section-title" id="sec-title">✨ おすすめ</div>

      <!-- Recommend Cards -->
      <div id="recs"></div>

      <!-- Chips -->
      <div class="chips" id="chips">
        <div class="chip active" data-f="all">すべて</div>
        <div class="chip" data-f="tsuruse">鶴瀬</div>
        <div class="chip" data-f="ikebukuro">池袋</div>
        <div class="chip" data-f="kawagoe">川越</div>
      </div>

      <!-- Link Cards -->
      <div id="cards"></div>
    </div>

    <!-- Station Picker -->
    <div class="picker" id="picker">
      <div class="picker-handle"></div>
      <div class="picker-title">🚃 駅を選んでね</div>
      <div id="picker-items"></div>
    </div>

    <!-- Post Form -->
    <div class="form-overlay" id="form-overlay">
      <div class="form-box">
        <div class="form-title">📎 リンクを投稿</div>
        <div class="form-label">🚃 駅</div>
        <div class="form-input" id="f-station">鶴瀬</div>
        <div class="form-label">タイトル</div>
        <div class="form-input" id="f-title">新しいカフェ オープン</div>
        <div class="form-label">URL</div>
        <div class="form-input" id="f-url">https://example.com</div>
        <button class="form-btn" id="f-btn">投稿する</button>
      </div>
    </div>

    <!-- Subtitle -->
    <div class="sub" id="sub"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Progress -->
    <div class="progress" id="progress"></div>

    <!-- End overlay -->
    <div class="end-bg" id="end-bg">
      <div class="end-emoji">🚃</div>
      <div class="end-title">東上リンク</div>
      <div class="end-sub">もうすぐはじまります</div>
    </div>
  </div>
</div>

<script>
  // ═══ BIG DATA (only 3 posts, simpler) ═══
  const DATA = [
    {
      id: 'a1', station: '鶴瀬',
      title: '鶴瀬駅徒歩5分🌸 甘酒＆麹カフェ',
      link: '麹カフェ つるせ',
      tags: ['麹', '甘酒'],
      common: 5,
      filter: 'tsuruse'
    },
    {
      id: 'a2', station: '池袋',
      title: '英会話カフェ 🇬🇧 初心者歓迎',
      link: '東上線 英会話カフェ',
      tags: ['英会話'],
      common: 12,
      filter: 'ikebukuro'
    },
    {
      id: 'a3', station: '川越',
      title: 'レコード喫茶 🎵 アナログ1000枚',
      link: 'レコード喫茶 小江戸',
      tags: ['レコード'],
      common: 23,
      filter: 'kawagoe'
    }
  ];

  const STATIONS = [
    { name: '池袋', rec: true },
    { name: '鶴瀬', rec: true },
    { name: '志木', rec: false },
    { name: '川越', rec: true },
  ];

  // ═══ RENDER ═══
  function renderRecs() {
    const el = document.getElementById('recs');
    el.innerHTML = DATA.map((d, i) => `
      <div class="rec" id="rec-${d.id}" style="transition-delay:${i*0.15}s">
        <div class="rec-icon">${['🎯','🔥','💡'][i]}</div>
        <div class="rec-title">${d.title}</div>
        <div class="rec-sub">${d.station} · 共通${d.common}人</div>
      </div>
    `).join('');
  }

  function renderCards(highlightId = null) {
    const el = document.getElementById('cards');
    el.innerHTML = DATA.map(d => {
      const isHL = highlightId && d.id === highlightId;
      return `
        <div class="card ${isHL ? 'highlight' : ''}" id="card-${d.id}">
          <div class="card-station">🚃 ${d.station}<span class="card-time">2時間前</span></div>
          <div class="card-title">${d.title}</div>
          <div class="card-link">🔗 ${d.link}</div>
          <div>${d.tags.map(t => `<span class="card-tag">#${t}</span>`).join('')}</div>
          <button class="save-btn" id="save-${d.id}">📍 行ってみたい！</button>
        </div>
      `;
    }).join('');
  }

  function renderPicker() {
    const el = document.getElementById('picker-items');
    el.innerHTML = STATIONS.map(s => `
      <div class="picker-item ${s.rec ? 'rec-star' : ''}" id="pi-${s.name}">
        🚃 ${s.name}
        ${s.rec ? '<span class="picker-badge">おすすめ</span>' : ''}
      </div>
    `).join('');
  }

  renderRecs();
  renderCards();
  renderPicker();

  // ═══ HELPERS ═══
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);
  const main = $('main');

  function sub(text) { $('sub').textContent = text; $('sub').classList.add('show'); }
  function hideSub() { $('sub').classList.remove('show'); }
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function setProgress(pct) { $('progress').style.width = pct + '%'; }

  // ═══ DEMO SEQUENCE ═══
  async function play() {
    const DURATION = 48000;
    const start = Date.now();
    const prog = setInterval(() => setProgress(((Date.now()-start)/DURATION)*100), 100);

    // ── Scene 1: Opening (0-5s) ──
    sub('東上線沿線の、リンク発見ボード');
    $('logo').classList.add('show');
    await sleep(800);
    $('sec-title').classList.add('show');
    await sleep(400);
    document.querySelectorAll('.rec').forEach((el, i) => {
      setTimeout(() => el.classList.add('show'), i * 300);
    });
    await sleep(1200);
    document.querySelectorAll('.card').forEach((el, i) => {
      setTimeout(() => el.classList.add('show'), i * 300);
    });
    await sleep(1500);
    hideSub();
    await sleep(500);

    // ── Scene 2: Station Picker (5-13s) ──
    sub('駅を選んでね — ぷるぷる動くよ！');
    await sleep(600);
    $('picker').classList.add('open');
    await sleep(800);

    // Highlight 鶴瀬
    const pi = $('pi-鶴瀬');
    pi.classList.add('jelly');
    await sleep(600);
    pi.style.background = '#e8ecff';
    await sleep(500);
    hideSub();

    // Close picker
    $('picker').classList.remove('open');
    await sleep(600);

    // ── Scene 3: Filter (13-18s) ──
    sub('駅ごとに、リンクが並ぶ');
    $('chips').classList.add('show');
    await sleep(600);

    // Tap 鶴瀬 chip
    const chips = document.querySelectorAll('.chip');
    chips.forEach(c => c.classList.remove('active','hl'));
    const tsuruseChip = document.querySelector('[data-f="tsuruse"]');
    tsuruseChip.classList.add('hl');

    // Dim other cards
    document.getElementById('card-a2').classList.add('dim');
    document.getElementById('card-a3').classList.add('dim');
    document.getElementById('card-a1').classList.add('highlight');
    await sleep(1200);

    // Reset
    chips.forEach(c => c.classList.remove('active','hl'));
    chips[0].classList.add('active');
    document.querySelectorAll('.card').forEach(c => { c.classList.remove('dim','highlight'); });
    await sleep(600);
    hideSub();
    await sleep(500);

    // ── Scene 4: Save (18-26s) ──
    sub('「行ってみたい！」ボタンをタッチ');
    main.scrollTo({ top: 300, behavior: 'smooth' });
    await sleep(600);

    // Tap save on card a3 (川越)
    const saveBtn = $('save-a3');
    saveBtn.classList.add('pulse');
    await sleep(300);
    saveBtn.textContent = '✓ 保存したよ！';
    saveBtn.classList.add('saved');
    await sleep(800);
    hideSub();
    await sleep(1000);

    // ── Scene 5: Connection (26-32s) ──
    sub('同じことに興味がある人がいるかも');
    main.scrollTo({ top: 100, behavior: 'smooth' });
    await sleep(500);
    // Show common users on card a2
    const card2 = $('card-a2');
    const banner = document.createElement('div');
    banner.style.cssText = 'margin-top:12px;padding:14px 16px;background:#fff8e1;border-radius:12px;font-size:18px;font-weight:600;color:#8d6e00;';
    banner.textContent = '👥 #英会話 に興味がある人と共通しています';
    banner.style.opacity = '0';
    banner.style.transition = 'opacity 0.6s';
    card2.appendChild(banner);
    await sleep(100);
    banner.style.opacity = '1';
    await sleep(1500);
    hideSub();
    await sleep(800);

    // ── Scene 6: Post (32-40s) ──
    sub('あなたも、1日に1回投稿できるよ');
    await sleep(500);

    // Open form
    $('form-overlay').classList.add('open');
    await sleep(600);

    // Fields activate
    $('f-station').classList.add('active');
    await sleep(400);
    $('f-title').classList.add('active');
    await sleep(400);
    $('f-url').classList.add('active');
    await sleep(400);
    $('f-btn').classList.add('show');
    await sleep(600);

    // Submit
    $('form-overlay').classList.remove('open');
    await sleep(400);
    toast('📎 投稿したよ！');
    await sleep(300);

    // Add new card
    const newCard = document.createElement('div');
    newCard.className = 'card show';
    newCard.style.border = '3px solid #5b6abf';
    newCard.innerHTML = `
      <div class="card-station">🚃 鶴瀬<span class="card-time">たった今</span></div>
      <div class="card-title">新しいカフェ オープン ☕</div>
      <div class="card-link">🔗 新カフェ 鶴瀬</div>
      <button class="save-btn">📍 行ってみたい！</button>
    `;
    const cardsEl = $('cards');
    cardsEl.insertBefore(newCard, cardsEl.firstChild);
    await sleep(1000);
    hideSub();
    await sleep(1000);

    // ── Scene 7: End (40-48s) ──
    sub('写真もログインも、いらない 🚃');
    await sleep(2000);
    hideSub();

    // Show end overlay
    $('end-bg').classList.add('show');
    await sleep(2000);
    sub('もうすぐはじまります');
    await sleep(3000);
    hideSub();

    clearInterval(prog);
    setProgress(100);
  }

  // Auto-start
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(play, 500);
  });
</script>
</body>
</html>
