<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>東上リンク｜DJスポット調査</title>
<meta name="description" content="東武東上線沿線のDJ・音楽スポットをエビデンス付きで探す動的リサーチサイト">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#151515;background:#f4f4f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:20px}header{background:#111;color:#fff;border-radius:24px;padding:28px;margin-bottom:16px}h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}header p{margin:0;opacity:.72}.controls{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px;gap:9px;margin:12px 0}input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:13px;background:#fff;font-size:15px}.count{color:#666;font-size:13px;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:19px;padding:17px;box-shadow:0 4px 16px #0000000a}.card h2{font-size:20px;margin:0 0 5px}.meta{font-size:13px;color:#777;margin-bottom:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:700;margin:2px 4px 8px 0}.strong{background:#d9f7df}.medium{background:#fff0bd}.weak{background:#eee}.unknown{background:#ffdada}p{line-height:1.55}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}a{background:#111;color:#fff;text-decoration:none;border-radius:10px;padding:9px 11px;font-size:13px}.secondary{background:#e9e9e9;color:#111}.empty{text-align:center;padding:30px;color:#777;display:none}.error{background:#ffe3e3;border-radius:14px;padding:15px;display:none}footer{margin:24px 2px;color:#888;font-size:12px}@media(max-width:720px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><header><h1>🚃 東上リンク</h1><p>DJスポット・音楽イベントを、Instagramとエビデンスから掘る。</p></header><div class="controls"><input id="q" placeholder="店名・駅・ジャンル・キーワード"><select id="area"><option value="">エリアすべて</option></select><select id="ev"><option value="">DJエビデンスすべて</option><option>最強</option><option>強</option><option>中</option><option>弱〜中</option><option>弱</option><option>不明</option></select></div><div id="count" class="count"></div><div id="error" class="error"></div><section id="grid" class="grid"></section><div id="empty" class="empty">条件に一致する候補がありません。</div><footer>JSONL DB: data/dj-bars/tobu-tojo-dj-bars.jsonl ｜ リサーチ更新型サイト</footer></main>
<script>
const $=s=>document.querySelector(s);let items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cls(s){return s==='最強'||s==='強'?'strong':s==='中'?'medium':s==='弱'||s==='弱〜中'?'weak':'unknown'}
function card(x){let links='';if(x.instagram)links+=`<a href="${esc(x.instagram)}" target="_blank" rel="noopener">Instagram</a>`;if(x.instagram_search)links+=`<a class="secondary" href="${esc(x.instagram_search)}" target="_blank" rel="noopener">Instagram検索</a>`;for(const [i,u] of (x.sources||[]).entries())links+=`<a class="secondary" href="${esc(u)}" target="_blank" rel="noopener">根拠${i+1}</a>`;return `<article class="card"><h2>${esc(x.name)}</h2><div class="meta">${esc(x.area)} / ${esc(x.station)} / ${esc(x.category)}</div><span class="badge ${cls(x.dj_evidence)}">DJ: ${esc(x.dj_evidence)}</span><span class="badge">${esc(x.dj_status)}</span><p>${esc(x.shorts?.hook||'')}</p><p>${esc(x.notes||'')}</p><p><b>次に確認：</b>${esc(x.next_action||'')}</p><div class="actions">${links}</div></article>`}
function render(){const term=$('#q').value.trim().toLowerCase(),area=$('#area').value,ev=$('#ev').value;const a=items.filter(x=>{const hay=[x.name,x.area,x.station,x.category,x.dj_status,x.next_action,x.shorts?.title,x.shorts?.script].join(' ').toLowerCase();return(!term||hay.includes(term))&&(!area||x.area===area)&&(!ev||x.dj_evidence===ev)});$('#count').textContent=`${a.length}件 / 全${items.length}件`;$('#grid').innerHTML=a.map(card).join('');$('#empty').style.display=a.length?'none':'block'}
async function init(){const r=await fetch('./data/dj-bars/tobu-tojo-dj-bars.jsonl');if(!r.ok)throw Error('JSONL '+r.status);const text=await r.text();items=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(JSON.parse);[...new Set(items.map(x=>x.area))].sort().forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;$('#area').appendChild(o)});render()}
['q','area','ev'].forEach(id=>$('#'+id).addEventListener('input',render));init().catch(e=>{$('#error').style.display='block';$('#error').textContent='データを読み込めませんでした: '+e.message})
</script></body></html>
